name: Build Volleygrade APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del codice
        uses: actions/checkout@v4

      - name: 2. Configura Java (Ultima versione stabile)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configura Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Genera le cartelle di sistema mancanti
        # Questo comando crea android/ e ios/ in modo pulito
        run: flutter create --org com.app.volleygrade .

      - name: 5. Scarica le librerie
        run: flutter pub get

      - name: 6. Compila l'App
        run: flutter build apk --debug

      - name: 7. Salva l'APK per il download
        uses: actions/upload-artifact@v4
        with:
          name: Volleygrade-App-Pronta
          path: build/app/outputs/flutter-apk/app-debug.apk
