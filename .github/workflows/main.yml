name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Permette di avviare l'azione anche manualmente da GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17' # Consigliato per le ultime versioni di Android

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # AGGIUNGI QUESTE DUE RIGHE QUI SOTTO:
      - name: Generate missing platform folders
        run: flutter create .

      - name: Install dependencies
        run: flutter pub get


      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: volleygrade-pro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
